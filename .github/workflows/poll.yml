name: poll

on:
  schedule:
    # Avoid the top-of-hour Actions load spike; HKO nowcast data remains frequent.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run poller
        run: |
          pip install --quiet numpy
          python app/fetch.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      - name: Commit data
        run: |
          git config user.name "testing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state site
          git diff --cached --quiet || git commit -m "poll: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
