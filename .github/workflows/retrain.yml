name: cnn-evaluation

on:
  schedule:
    # Re-evaluate weekly only after data collection has accumulated; manual runs are preferred for experiments.
    - cron: "42 3 * * 0"
  workflow_dispatch:
    inputs:
      epochs:
        description: "CNN epochs for this benchmark run"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: cnn-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet numpy

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run CNN skill benchmark
        run: python app/cnn_benchmark.py --quiet --epochs "${{ inputs.epochs || '40' }}"

      - name: Commit benchmark report and eligible artifact
        run: |
          git config user.name "testing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/cnn_evaluation.json model/cnn_weights.json site/data/cnn_evaluation.json
          git diff --cached --quiet || git commit -m "cnn-evaluation: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
