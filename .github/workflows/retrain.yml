name: retrain

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet scikit-learn numpy

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Train tabular models
        run: python app/train.py

      - name: Train CNN when dataset schema is compatible
        run: python app/cnn.py

      - name: Validate portable model artifacts
        run: python app/check_artifacts.py

      - name: Commit model
        run: |
          git config user.name "testing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model
          git diff --cached --quiet || git commit -m "retrain: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
