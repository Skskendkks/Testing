name: retrain

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [poll]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet scikit-learn

      - name: Train
        run: python app/train.py

      - name: Commit model
        run: |
          git config user.name "skywager-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model
          git diff --cached --quiet || git commit -m "retrain: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
